<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f4f6f5">
    <title>OpenCode Go Key 管理</title>
    <link rel="stylesheet" href="/styles.css?v=console-4">
  </head>
  <body data-page="keys">
    <div class="console-shell">
      <aside class="console-sidebar" aria-label="主导航">
        <a class="brand" href="/" aria-label="OpenCode Go"><span class="brand-mark" aria-hidden="true">GO</span><span class="brand-copy"><strong>OpenCode Go</strong><small>额度工作台</small></span></a>
        <nav class="primary-nav"><a id="dashboard-link" href="/" data-nav="dashboard"><span data-copy="back">额度看板</span><small>账号用量</small></a><a href="/admin" data-nav="keys"><span>Key 管理</span><small>账号与额度</small></a><a id="users-link" href="/users" data-nav="users"><span data-copy="manageUsers">用户管理</span><small>访问控制</small></a><a href="/profile" data-nav="profile"><span>个人设置</span><small>账号安全</small></a></nav>
        <div class="sidebar-note"><span class="sidebar-note-label">管理范围</span><strong>账号与权限</strong><span>数据加密保存</span></div>
      </aside>
      <div class="console-content">
        <header class="global-bar"><a class="mobile-brand" href="/" aria-label="OpenCode Go"><span class="brand-mark" aria-hidden="true">GO</span><span>OpenCode Go</span></a><div class="global-actions"><div class="language-switch" role="group" aria-label="Language"><button type="button" data-locale="zh" aria-pressed="true">中文</button><button type="button" data-locale="en" aria-pressed="false">EN</button></div><a class="text-command" href="/profile">个人设置</a><button id="logout-button" class="text-command" type="button" title="退出登录" aria-label="退出登录"><span data-copy="logout">退出登录</span></button></div></header>
        <nav class="compact-nav" aria-label="主导航"><a href="/" data-nav="dashboard">额度看板</a><a href="/admin" data-nav="keys">Key 管理</a><a href="/users" data-nav="users">用户与权限</a><a href="/profile" data-nav="profile">个人设置</a></nav>
        <main class="workspace admin-workspace">
          <section class="page-header" aria-labelledby="admin-page-title"><div><p class="eyebrow" data-copy="eyebrow">账号管理</p><h1 id="admin-page-title" data-copy="title">Key 管理</h1><p class="page-description" data-copy="subtitle">添加和管理额度看板使用的账号</p></div><span id="account-count" class="count-badge">数量：0</span></section>
          <section id="admin-error" class="error-banner" role="alert" hidden><strong id="admin-error-title"></strong><span id="admin-error-message"></span></section>
          <section class="control-strip" aria-label="账号工具"><div class="auto-refresh-slot"><form id="auto-refresh-form" class="auto-refresh-form"><label class="auto-refresh-toggle" for="auto-refresh-enabled"><input id="auto-refresh-enabled" type="checkbox" checked><span data-copy="autoRefresh">自动刷新</span></label><div class="auto-refresh-fields"><span>每</span><input id="auto-refresh-value" type="number" min="10" max="1440" step="1" value="30" inputmode="numeric" aria-label="刷新间隔"><select id="auto-refresh-unit" aria-label="刷新间隔单位"><option value="seconds" data-copy="seconds">秒</option><option value="minutes" data-copy="minutes">分钟</option></select></div></form></div><div class="control-actions"><button id="refresh-all" class="command-button secondary" type="button" title="刷新全部额度" aria-label="刷新全部额度"><span data-copy="refreshAll">刷新全部额度</span></button><button id="backup-button" class="command-button secondary" type="button" title="备份账号" aria-label="备份账号"><span data-copy="backup">下载备份</span></button><button id="restore-button" class="command-button secondary" type="button" title="恢复账号" aria-label="恢复账号"><span data-copy="restore">恢复备份</span></button><input id="restore-input" type="file" accept="application/json,.json" hidden></div></section>
          <details class="entry-panel"><summary><span class="entry-summary-title" data-copy="addTitle">添加 Key</span><span class="entry-summary-help">录入新的账号和生命周期</span></summary><div class="entry-panel-body"><form id="add-form" class="key-form"><div class="key-primary-fields"><div class="field"><label for="account-label" data-copy="label">账号名称</label><input id="account-label" name="label" maxlength="80" autocomplete="off" required></div><div class="field"><label for="account-key" data-copy="apiKey">API Key</label><input id="account-key" name="key" type="password" minlength="8" maxlength="512" autocomplete="new-password" spellcheck="false" required></div></div><div class="lifecycle-fields"><div class="field"><label for="account-starts-at" data-copy="startsAt">开通日期</label><input id="account-starts-at" name="startsAt" type="date"></div><div class="field"><label for="account-expires-at" data-copy="expiresAt">结束日期</label><input id="account-expires-at" name="expiresAt" type="date"></div><label class="checkbox-field lifecycle-checkbox" for="account-auto-delete"><input id="account-auto-delete" name="autoDelete" type="checkbox"><span data-copy="autoDeleteMonth">一个月到期自动删除</span></label></div><div class="entry-submit"><button id="add-button" class="command-button" type="submit" data-copy="add">添加</button></div></form></div></details>
          <section class="data-region key-region" aria-labelledby="account-list-title"><header class="data-region-header"><div><p class="section-kicker">已保存账号</p><h2 id="account-list-title" data-copy="accounts">账号</h2></div><span>可查看额度、到期状态和模型测试结果</span></header><div class="key-table-header" aria-hidden="true"><span>账号</span><span>状态与期限</span><span>额度</span><span>模型测试</span><span>操作</span></div><div id="account-list" class="account-list"></div></section>
        </main>
        <footer><span>OpenCode Go 额度工作台</span><span data-copy="encrypted">AES-256-GCM 加密存储</span></footer>
      </div>
    </div>
    <dialog id="edit-dialog"><form id="edit-form" class="dialog-body"><div class="dialog-heading"><p class="eyebrow">账号设置</p><h2 data-copy="editTitle">编辑账号</h2></div><p id="edit-error" class="dialog-error" role="alert" hidden></p><div class="dialog-fields"><div class="field"><label for="edit-label" data-copy="label">账号名称</label><input id="edit-label" name="label" maxlength="80" autocomplete="off" required></div><div class="field"><label for="edit-key" data-copy="replacementKey">替换 Key（留空则不修改）</label><input id="edit-key" name="key" type="password" maxlength="512" autocomplete="new-password" spellcheck="false"></div><div class="lifecycle-fields dialog-lifecycle-fields"><div class="field"><label for="edit-starts-at" data-copy="startsAt">开通日期</label><input id="edit-starts-at" name="startsAt" type="date"></div><div class="field"><label for="edit-expires-at" data-copy="expiresAt">结束日期</label><input id="edit-expires-at" name="expiresAt" type="date"></div><label class="checkbox-field lifecycle-checkbox" for="edit-auto-delete"><input id="edit-auto-delete" name="autoDelete" type="checkbox"><span data-copy="autoDeleteMonth">一个月到期自动删除</span></label></div><label class="checkbox-field"><input id="edit-enabled" name="enabled" type="checkbox"><span data-copy="enabled">启用</span></label></div><div class="dialog-actions"><button id="edit-cancel" class="command-button secondary" type="button" data-copy="cancel">取消</button><button class="command-button" type="submit" data-copy="save">保存</button></div></form></dialog>
    <dialog id="test-dialog"><form id="test-form" class="dialog-body"><div class="dialog-heading"><p class="eyebrow">真实请求</p><h2 data-copy="testDialogTitle">选择测试模型</h2></div><p id="test-model-error" class="dialog-error" role="alert" hidden></p><div class="dialog-fields"><div class="field"><label for="test-model-select" data-copy="testModelLabel">模型</label><select id="test-model-select" required disabled></select></div></div><div class="dialog-actions"><button id="test-cancel" class="command-button secondary" type="button" data-copy="cancel">取消</button><button id="test-submit" class="command-button" type="submit" data-copy="startModelTest" disabled>开始测试</button></div></form></dialog>
    <script type="module" src="/admin.js?v=console-4"></script>
  </body>
</html>
