<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f4f6f5">
    <title>OpenCode Go 登录</title>
    <link rel="stylesheet" href="/styles.css?v=console-4">
  </head>
  <body class="auth-page">
    <main class="auth-shell"><section class="auth-intro"><a class="brand" href="/login" aria-label="OpenCode Go"><span class="brand-mark" aria-hidden="true">GO</span><span class="brand-copy"><strong>OpenCode Go</strong><small>额度工作台</small></span></a><div><p class="eyebrow">受保护的后台</p><h1>登录后管理<br>账号与额度</h1><p>查看已授权账号的额度，管理 Key、生命周期和用户权限。</p></div><div class="auth-note"><strong>安全登录</strong><span>登录凭据和 Key 均不会返回到浏览器。</span></div></section><section class="login-panel" aria-labelledby="login-title"><div class="login-heading"><p class="eyebrow">账号登录</p><h2 id="login-title">欢迎回来</h2><p>请输入后台账号和密码。</p></div><form id="login-form" class="login-form"><label class="field"><span>账号</span><input id="login-username" name="username" autocomplete="username" required></label><label class="field"><span>密码</span><input id="login-password" name="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="dialog-error" role="alert" hidden>账号或密码错误</p><button id="login-submit" class="command-button" type="submit">登录</button></form></section></main>
    <script type="module" src="/login.js?v=console-4"></script>
  </body>
</html>
